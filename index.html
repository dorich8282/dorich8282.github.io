<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>우리 가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="우리 가계부" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e6e0;
    --text: #1a1a18;
    --text-sub: #8a8880;
    --text-hint: #b8b6b0;
    --accent: #1a1a18;
    --success-bg: #eaf5ef;
    --success-text: #2d7a4f;
    --husband-bg: #e8f0fe;
    --husband-text: #1a56c4;
    --wife-bg: #fce8f3;
    --wife-text: #b5247a;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  #app { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* onboarding */
  #onboarding { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; gap: 12px; }
  .ob-emoji { font-size: 48px; margin-bottom: 8px; }
  .ob-title { font-size: 22px; font-weight: 700; }
  .ob-sub { font-size: 14px; color: var(--text-sub); text-align: center; line-height: 1.6; margin-bottom: 16px; }
  .ob-btn { width: 100%; padding: 16px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .ob-btn:active { transform: scale(0.98); background: var(--bg); }
  .ob-btn.husband { border-color: var(--husband-text); color: var(--husband-text); background: var(--husband-bg); }
  .ob-btn.wife { border-color: var(--wife-text); color: var(--wife-text); background: var(--wife-bg); }

  /* header */
  .header { background: var(--surface); padding: 1rem 1.25rem 0.875rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .who-pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; cursor: pointer; border: none; font-family: inherit; transition: opacity 0.15s; }
  .who-pill:active { opacity: 0.7; }
  .who-pill.husband { background: var(--husband-bg); color: var(--husband-text); }
  .who-pill.wife { background: var(--wife-bg); color: var(--wife-text); }
  .sync-pill { font-size: 11px; padding: 4px 10px; background: var(--success-bg); color: var(--success-text); border-radius: 20px; display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .nav-btn { background: none; border: none; font-size: 20px; color: var(--text-sub); cursor: pointer; padding: 0 2px; line-height: 1; font-family: inherit; }
  .nav-btn:active { color: var(--text); }
  .month-text { font-size: 15px; font-weight: 700; flex: 1; }
  .total-row { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
  .total-num { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .total-label { font-size: 13px; color: var(--text-sub); }

  /* tabs */
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 11px; text-align: center; font-size: 13px; font-weight: 500; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; font-family: inherit; background: none; border-top: none; border-left: none; border-right: none; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }

  /* input card */
  .input-card { background: var(--surface); margin: 12px 12px 0; border-radius: var(--radius); border: 1px solid var(--border); padding: 1rem; }
  .input-row { display: flex; gap: 8px; align-items: stretch; }
  .amount-wrap { position: relative; flex: 1; }
  .won-sign { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-sub); pointer-events: none; font-weight: 500; }
  input[type=number], input[type=text] {
    width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-family: inherit; outline: none;
    transition: border-color 0.15s;
  }
  input[type=number]:focus, input[type=text]:focus { border-color: var(--text); }
  #amount-input { padding: 10px 10px 10px 26px; font-size: 20px; font-weight: 700; ime-mode: disabled; }
  #memo-input { padding: 9px 12px; font-size: 14px; margin-top: 8px; }
  #memo-input::placeholder, #amount-input::placeholder { color: var(--text-hint); font-weight: 400; }
  .add-btn { padding: 10px 18px; background: var(--text); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
  .add-btn:active { opacity: 0.75; }

  /* list */
  .list-panel { padding: 4px 12px 100px; }
  .date-header { font-size: 12px; color: var(--text-sub); font-weight: 500; padding: 14px 2px 6px; }
  .entry-item { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .entry-who-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry-who-dot.husband { background: var(--husband-text); }
  .entry-who-dot.wife { background: var(--wife-text); }
  .entry-left { flex: 1; min-width: 0; }
  .entry-memo { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .entry-amount { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .del-btn { background: none; border: none; color: var(--text-hint); font-size: 18px; cursor: pointer; padding: 2px 4px; line-height: 1; transition: color 0.15s; }
  .del-btn:active { color: #e53935; }
  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-hint); font-size: 14px; line-height: 1.8; }

  /* chart */
  .chart-panel { padding: 12px 12px 100px; display: flex; flex-direction: column; gap: 10px; }
  .chart-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.25rem; }
  .chart-card-title { font-size: 12px; color: var(--text-sub); font-weight: 500; margin-bottom: 1rem; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-label { font-size: 12px; color: var(--text-sub); width: 28px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--bg); border-radius: 4px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--text); transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .bar-val { font-size: 11px; color: var(--text-sub); width: 72px; text-align: right; flex-shrink: 0; }
  .who-grid { display: none; }
  .who-stat { border-radius: var(--radius-sm); padding: 14px; text-align: center; }
  .who-stat.husband { background: var(--husband-bg); }
  .who-stat.wife { background: var(--wife-bg); }
  .who-stat-name { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
  .who-stat.husband .who-stat-name { color: var(--husband-text); }
  .who-stat.wife .who-stat-name { color: var(--wife-text); }
  .who-stat-amt { font-size: 16px; font-weight: 700; }
  .who-stat.husband .who-stat-amt { color: var(--husband-text); }
  .who-stat.wife .who-stat-amt { color: var(--wife-text); }
  .who-stat-pct { font-size: 11px; margin-top: 2px; opacity: 0.7; }
  .who-stat.husband .who-stat-pct { color: var(--husband-text); }
  .who-stat.wife .who-stat-pct { color: var(--wife-text); }

  /* loading */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; font-size: 14px; color: var(--text-sub); flex-direction: column; gap: 12px; }
  .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>불러오는 중...</div>
<div id="app" style="display:none;">

  <!-- onboarding -->
  <div id="onboarding" style="display:none;">
    <div class="ob-emoji">💰</div>
    <div class="ob-title">우리 가계부</div>
    <div class="ob-sub">처음이시네요!<br>누구로 시작할까요?<br><small style="color:var(--text-hint);">다음부터는 자동으로 기억해요</small></div>
    <button class="ob-btn husband" onclick="setUser('남편')">👨 남편</button>
    <button class="ob-btn wife" onclick="setUser('와이프')">👩 와이프</button>
  </div>

  <!-- main -->
  <div id="main" style="display:none; flex-direction:column; flex:1;">
    <div class="header">
      <div class="header-top">
        <button class="who-pill" id="who-pill" onclick="switchUser()"></button>
        <div class="sync-pill"><span class="sync-dot"></span> 실시간 공유</div>
      </div>
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-text" id="month-text"></div>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="total-row">
        <div class="total-num" id="total-num">0원</div>
        <div class="total-label">이번 달 지출</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-list" onclick="switchTab('list')">기록</button>
      <button class="tab" id="tab-chart" onclick="switchTab('chart')">통계</button>
    </div>

    <!-- list panel -->
    <div id="panel-list">
      <div class="input-card">
        <div class="input-row">
          <div class="amount-wrap">
            <span class="won-sign">₩</span>
            <input type="text" id="amount-input" placeholder="0" inputmode="numeric" />
          </div>
          <button class="add-btn" onclick="addEntry()">기록</button>
        </div>
        <input type="text" id="memo-input" placeholder="어디서 뭘 샀나요? (선택)" maxlength="40" />
        <input type="date" id="date-input" />
      </div>
      <div class="list-panel" id="list-section">
        <div class="empty-state" id="empty-state">아직 기록이 없어요 😊<br>첫 소비를 기록해보세요!</div>
      </div>
    </div>

    <!-- chart panel -->
    <div id="panel-chart" style="display:none;">
      <div class="chart-panel">
        <div class="chart-card">
          <div class="chart-card-title">주차별 지출</div>
          <div id="weekly-bars"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5pjQAhu9wG6WLJ5kq_7Q5XQkPaXXatmM",
  authDomain: "dorich-budget.firebaseapp.com",
  projectId: "dorich-budget",
  storageBucket: "dorich-budget.firebasestorage.app",
  messagingSenderId: "483986456256",
  appId: "1:483986456256:web:0e60331cab3a0b61c63725"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

let entries = [];
let currentUser = null;
let viewYear, viewMonth;
const now = new Date();
viewYear = now.getFullYear();
viewMonth = now.getMonth();

function fmt(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function fmtDate(ts) {
  const d = new Date(ts);
  const days = ['일','월','화','수','목','금','토'];
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일';
}
function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function getMonthEntries() {
  return entries.filter(e => {
    const d = new Date(e.ts);
    return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
  });
}

window.setUser = function(name) {
  currentUser = name;
  localStorage.setItem('hb_user', name);
  document.getElementById('onboarding').style.display = 'none';
  const main = document.getElementById('main');
  main.style.display = 'flex';
  const pill = document.getElementById('who-pill');
  pill.textContent = (name === '남편' ? '👨 남편' : '👩 와이프') + ' ›';
  pill.className = 'who-pill ' + (name === '남편' ? 'husband' : 'wife');
  render();
}

window.switchUser = function() {
  window.setUser(currentUser === '남편' ? '와이프' : '남편');
}

window.changeMonth = function(dir) {
  viewMonth += dir;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
  if (document.getElementById('panel-chart').style.display !== 'none') renderChart();
}

window.addEntry = async function() {
  const raw = document.getElementById('amount-input').value.replace(/,/g, '');
  const a = parseInt(raw, 10);
  if (!a || a <= 0) { document.getElementById('amount-input').focus(); return; }
  const memo = document.getElementById('memo-input').value.trim();
  const dateVal = document.getElementById('date-input').value;
  let ts;
  if (dateVal) {
    const [y, m, d] = dateVal.split('-').map(Number);
    const now = new Date();
    ts = new Date(y, m-1, d, now.getHours(), now.getMinutes(), now.getSeconds()).getTime();
  } else {
    ts = Date.now();
  }
  try {
    await addDoc(collection(db, 'entries'), { amount: a, memo, ts, who: currentUser });
    document.getElementById('amount-input').value = '';
    document.getElementById('memo-input').value = '';
    // 날짜는 오늘로 리셋
    document.getElementById('date-input').value = getTodayStr();
  } catch(e) { alert('저장 실패: ' + e.message); }
}

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

window.deleteEntry = async function(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  try { await deleteDoc(doc(db, 'entries', id)); } catch(e) { alert('삭제 실패'); }
}

window.switchTab = function(tab) {
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('tab-chart').classList.toggle('active', tab === 'chart');
  document.getElementById('panel-list').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('panel-chart').style.display = tab === 'chart' ? 'block' : 'none';
  if (tab === 'chart') renderChart();
}

function render() {
  const me = getMonthEntries();
  const total = me.reduce((s,e) => s + e.amount, 0);
  document.getElementById('month-text').textContent = viewYear + '년 ' + (viewMonth+1) + '월';
  document.getElementById('total-num').textContent = fmt(total);

  const listEl = document.getElementById('list-section');
  listEl.querySelectorAll('.date-group').forEach(g => g.remove());
  const emptyEl = document.getElementById('empty-state');
  if (me.length === 0) { emptyEl.style.display = 'block'; return; }
  emptyEl.style.display = 'none';

  const sorted = [...me].sort((a,b) => b.ts - a.ts);
  const groups = {};
  sorted.forEach(e => {
    const key = fmtDate(e.ts);
    if (!groups[key]) groups[key] = { label: key, items: [], total: 0 };
    groups[key].items.push(e);
    groups[key].total += e.amount;
  });

  Object.values(groups).forEach(grp => {
    const div = document.createElement('div');
    div.className = 'date-group';
    const hdr = document.createElement('div');
    hdr.className = 'date-header';
    hdr.textContent = grp.label + ' · ' + fmt(grp.total);
    div.appendChild(hdr);
    grp.items.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'entry-item';
      const whoClass = entry.who === '남편' ? 'husband' : 'wife';
      item.innerHTML = `
        <div class="entry-who-dot ${whoClass}"></div>
        <div class="entry-left">
          <div class="entry-memo">${entry.memo || '소비'}</div>
          <div class="entry-meta">${fmtTime(entry.ts)} · ${entry.who || ''}</div>
        </div>
        <div class="entry-amount">${fmt(entry.amount)}</div>
        <button class="del-btn" onclick="deleteEntry('${entry.id}')">×</button>
      `;
      div.appendChild(item);
    });
    listEl.appendChild(div);
  });
}

function renderChart() {
  const me = getMonthEntries();
  const weeks = [0,0,0,0,0];
  me.forEach(e => {
    const day = new Date(e.ts).getDate();
    weeks[Math.min(Math.floor((day-1)/7), 4)] += e.amount;
  });
  const maxW = Math.max(...weeks, 1);
  const labels = ['1주','2주','3주','4주','5주'];
  const barsEl = document.getElementById('weekly-bars');
  barsEl.innerHTML = '';
  weeks.forEach((v,i) => {
    if (i === 4 && v === 0) return;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label">${labels[i]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxW*100)}%"></div></div>
      <div class="bar-val">${v > 0 ? fmt(v) : '-'}</div>
    `;
    barsEl.appendChild(row);
  });
}

// realtime listener
const q = query(collection(db, 'entries'), orderBy('ts', 'desc'));
onSnapshot(q, (snapshot) => {
  entries = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const saved = localStorage.getItem('hb_user');
  if (!currentUser) {
    if (saved) { window.setUser(saved); }
    else { document.getElementById('onboarding').style.display = 'flex'; }
  } else {
    render();
    if (document.getElementById('panel-chart').style.display !== 'none') renderChart();
  }
}, (err) => {
  document.getElementById('loading').innerHTML = '❌ 연결 실패<br><small>' + err.message + '</small>';
});

document.getElementById('amount-input').addEventListener('input', function() {
  const raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
  if (!raw) { this.value = ''; return; }
  const formatted = parseInt(raw, 10).toLocaleString('ko-KR');
  this.value = formatted;
});
document.getElementById('amount-input').addEventListener('keydown', e => { if (e.key === 'Enter') window.addEntry(); });
document.getElementById('date-input').value = getTodayStr();
</script>
</body>
</html>
